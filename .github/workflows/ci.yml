name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Lint
        run: make PYTHON=python lint
      - name: Typecheck
        run: make PYTHON=python typecheck
      - name: Test
        run: make PYTHON=python test
