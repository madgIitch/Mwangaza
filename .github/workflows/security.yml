name: Security baseline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m mwangaza.security.scan
      - run: python -m unittest tests.security.test_security
