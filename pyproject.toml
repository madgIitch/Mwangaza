[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mwangaza"
version = "0.0.1"
description = "Satellite-powered drought early warning and early action platform for the IGAD region."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mwangaza contributors" }]
dependencies = [
  "earthengine-api>=1.7.35",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]
app = [
  "streamlit>=1.36",
  "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mwangaza"]

[tool.pytest.ini_options]
testpaths = ["tests"]
